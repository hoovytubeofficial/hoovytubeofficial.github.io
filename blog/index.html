<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>Journal - HoovyTube</title>
  <meta name="description" content="Essays and notes from behind the tools - on making things, giving them away, and the shoulders worth standing on.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/ht.css?v=9">
  <script>try{var t=localStorage.getItem('ht-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <style>
    /* ============ Journal ============ */
    .journal { max-width: 940px; margin: 0 auto; padding: 0 1.25rem; }

    /* View transitions */
    .view { animation: viewIn .45s cubic-bezier(.16,1,.3,1); }
    @keyframes viewIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .view { animation: none; } }

    /* ---- Index: featured + list ---- */
    .j-featured { position: relative; display: block; text-decoration: none; color: inherit;
      border: 1px solid var(--line); border-radius: 22px; overflow: hidden; background: var(--panel);
      box-shadow: 0 18px 50px rgba(0,0,0,.14); transition: transform .3s cubic-bezier(.16,1,.3,1), box-shadow .3s, border-color .3s; }
    .j-featured:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 26px 70px var(--glow); }
    .j-featured .j-cover { position: relative; aspect-ratio: 2 / 1; overflow: hidden; background: #10171f; }
    .j-featured .j-cover img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s cubic-bezier(.16,1,.3,1); }
    .j-featured:hover .j-cover img { transform: scale(1.04); }
    .j-featured .j-body { padding: 1.7rem 1.9rem 1.9rem; }
    .j-eyebrow { display: inline-flex; align-items: center; gap: .5rem; color: var(--accent);
      font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: .7rem; margin: 0 0 .7rem; }
    .j-eyebrow::before { content: ""; width: 20px; height: 1.5px; background: var(--accent); display: inline-block; }
    .j-featured h2 { font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; letter-spacing: -.02em;
      font-size: clamp(1.5rem, 3.6vw, 2.15rem); line-height: 1.08; margin: 0 0 .6rem; color: var(--text); }
    .j-featured .j-dek { color: var(--muted); font-size: 1.02rem; line-height: 1.6; margin: 0 0 1.1rem; max-width: 62ch; }
    .j-meta { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .8rem; font-size: .82rem; color: var(--muted); }
    .j-meta .dot { opacity: .5; }
    .j-tags { display: flex; flex-wrap: wrap; gap: .4rem; }
    .j-tag { font-size: .68rem; font-weight: 700; letter-spacing: .03em; text-transform: uppercase;
      color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent);
      padding: .22rem .6rem; border-radius: 999px; }
    .j-readmore { display: inline-flex; align-items: center; gap: .45rem; margin-top: 1.2rem;
      font-weight: 600; color: var(--accent); }
    .j-readmore svg { width: 17px; height: 17px; stroke: currentColor; fill: none; transition: transform .25s; }
    .j-featured:hover .j-readmore svg { transform: translateX(4px); }

    .j-listhead { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem;
      margin: 3rem 0 1.2rem; }
    .j-listhead h3 { font-family: 'Space Grotesk', sans-serif; font-size: 1.15rem; margin: 0; color: var(--text); }
    .j-listhead span { font-size: .85rem; color: var(--muted); }

    .j-list { display: flex; flex-direction: column; gap: .2rem; }
    .j-row { display: grid; grid-template-columns: 120px 1fr; gap: 1.2rem; align-items: center;
      text-decoration: none; color: inherit; padding: 1.1rem .6rem; border-radius: 16px;
      border: 1px solid transparent; transition: border-color .25s, background .25s, transform .25s; }
    .j-row + .j-row { border-top: 1px solid var(--line); border-radius: 0; }
    .j-row:hover { border-color: var(--line); border-radius: 16px; background: var(--panel);
      transform: translateX(2px); }
    .j-row:hover + .j-row { border-top-color: transparent; }
    .j-thumb { aspect-ratio: 3 / 2; border-radius: 11px; overflow: hidden; background: #10171f; border: 1px solid var(--line); }
    .j-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .j-row h4 { font-family: 'Space Grotesk', sans-serif; font-size: 1.12rem; margin: 0 0 .3rem; color: var(--text); line-height: 1.15; }
    .j-row p { color: var(--muted); font-size: .9rem; line-height: 1.5; margin: 0 0 .5rem;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    @media (max-width: 560px) {
      .j-row { grid-template-columns: 84px 1fr; gap: .9rem; }
      .j-featured .j-body { padding: 1.3rem 1.2rem 1.5rem; }
    }

    .j-empty { text-align: center; color: var(--muted); font-size: .92rem; padding: 1.4rem;
      border: 1px dashed var(--line); border-radius: 16px; }

    /* cover fallback (when image missing) */
    .j-fallback { position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: .6rem; text-align: center; padding: 1.5rem;
      background: radial-gradient(120% 120% at 50% 0%, var(--panel-2), var(--hero-dark));
      color: var(--cream); }
    .j-fallback .fw { font-family: 'Space Grotesk', sans-serif; font-weight: 700; letter-spacing: .04em;
      font-size: 1.1rem; opacity: .85; }
    .j-fallback .ft { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: clamp(1.1rem, 3vw, 1.7rem);
      line-height: 1.1; max-width: 22ch; text-shadow: 0 2px 14px rgba(0,0,0,.4); }

    /* ---- Article ---- */
    .article { max-width: 720px; margin: 0 auto; }
    .j-back { display: inline-flex; align-items: center; gap: .45rem; font-size: .86rem; font-weight: 600;
      color: var(--muted); text-decoration: none; margin-bottom: 1.6rem; transition: color .2s, transform .2s; }
    .j-back:hover { color: var(--accent); transform: translateX(-3px); }
    .j-back svg { width: 16px; height: 16px; stroke: currentColor; fill: none; }

    .article-head { text-align: center; margin-bottom: 1.8rem; }
    .article-kicker { color: var(--accent); font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
      font-size: .72rem; margin: 0 0 .9rem; }
    .article-head h1 { font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; letter-spacing: -.025em;
      font-size: clamp(2rem, 5.2vw, 3.05rem); line-height: 1.06; margin: 0 auto; max-width: 16ch; color: var(--text); }
    .article-dek { font-family: 'Newsreader', Georgia, serif; font-style: italic; color: var(--muted);
      font-size: clamp(1.08rem, 2.4vw, 1.28rem); line-height: 1.5; margin: 1rem auto 0; max-width: 44ch; }
    .article-meta { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: .5rem .8rem;
      margin: 1.3rem 0 0; font-size: .82rem; color: var(--muted); }
    .article-meta .byline { font-weight: 600; color: var(--text); }

    .article-cover { margin: 2rem 0 2.4rem; border-radius: 18px; overflow: hidden; border: 1px solid var(--line);
      background: #10171f; position: relative; aspect-ratio: 2 / 1; box-shadow: 0 18px 50px rgba(0,0,0,.18); }
    .article-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .prose { font-family: 'Newsreader', Georgia, 'Times New Roman', serif; color: var(--text);
      font-size: 1.235rem; line-height: 1.78; }
    .prose p { margin: 0 0 1.5rem; }
    .prose p:first-of-type::first-letter { float: left; font-weight: 600; font-size: 3.6em; line-height: .72;
      padding: .06em .12em 0 0; color: var(--accent); font-family: 'Space Grotesk', sans-serif; }
    .prose h2 { font-family: 'Space Grotesk', sans-serif; font-size: 1.5rem; letter-spacing: -.01em;
      color: var(--text); margin: 2.6rem 0 1rem; }
    .prose blockquote { margin: 2.2rem 0; padding: .2rem 0 .2rem 1.5rem; border-left: 3px solid var(--accent);
      font-size: 1.5rem; line-height: 1.4; font-style: italic; color: var(--text); }
    .prose code { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; font-size: .86em;
      background: var(--panel-2); padding: .12em .4em; border-radius: 6px; }
    .prose a { color: var(--accent); font-weight: 500; text-decoration: none;
      background-image: linear-gradient(var(--accent), var(--accent)); background-repeat: no-repeat;
      background-position: 0 100%; background-size: 100% 1.5px; padding-bottom: 1px;
      transition: background-size .2s ease, color .15s ease; }
    .prose a:hover { color: var(--text); background-size: 100% 100%; background-image: linear-gradient(color-mix(in srgb, var(--accent) 18%, transparent), color-mix(in srgb, var(--accent) 18%, transparent)); }

    .article-foot { margin: 3rem 0 0; }
    .article-share { display: flex; align-items: center; gap: .7rem; flex-wrap: wrap;
      padding: 1.3rem 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .article-share span { font-size: .82rem; color: var(--muted); margin-right: .2rem; }
    .share-btn { display: inline-flex; align-items: center; gap: .4rem; font: inherit; font-size: .82rem; font-weight: 600;
      cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--text);
      border-radius: 999px; padding: .45rem .9rem; transition: border-color .2s, color .2s, background .2s; }
    .share-btn:hover { border-color: var(--accent); color: var(--accent); }
    .share-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; }

    .post-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1.6rem; }
    .post-nav a { text-decoration: none; color: inherit; border: 1px solid var(--line); border-radius: 14px;
      padding: 1rem 1.2rem; background: var(--panel); transition: border-color .2s, transform .2s, box-shadow .2s; }
    .post-nav a:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 12px 30px var(--glow); }
    .post-nav .pn-label { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .post-nav .pn-title { font-family: 'Space Grotesk', sans-serif; font-weight: 600; margin-top: .3rem; color: var(--text);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .post-nav a.next { text-align: right; }
    .post-nav a.disabled { opacity: .35; pointer-events: none; }
    @media (max-width: 560px) { .post-nav { grid-template-columns: 1fr; } .prose { font-size: 1.15rem; } }

    .toast { position: fixed; left: 50%; bottom: 108px; transform: translateX(-50%) translateY(10px);
      background: var(--text); color: var(--bg); font-size: .85rem; font-weight: 600; padding: .6rem 1rem;
      border-radius: 999px; box-shadow: 0 12px 30px rgba(0,0,0,.35); opacity: 0; pointer-events: none;
      transition: opacity .25s, transform .25s; z-index: 130; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <header class="pagehead">
    <div class="inner">
      <p class="eyebrow">Journal</p>
      <h1>Notes from behind the tools</h1>
      <p class="ph-lead">Essays on making things, giving them away, and the shoulders worth standing on. Written in my own amateurish way.</p>
    </div>
  </header>

  <main class="journal page" style="padding-top:1.4rem" id="journalRoot">
    <!-- rendered by JS -->
  </main>

  <footer class="site"><small>© 2026 HoovyTube. All rights reserved.</small></footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/blog/posts.js?v=2"></script>
  <script>
  (function () {
    var ICON = {
      arrowR: '<svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>',
      arrowL: '<svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>',
      link:   '<svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>'
    };
    var root = document.getElementById('journalRoot');
    var toastEl = document.getElementById('toast');
    var POSTS = (window.HT_POSTS || []).slice().sort(function (a, b) {
      return (b.date || '').localeCompare(a.date || '');
    });
    var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

    function esc(s) { return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
    // Turn [text](url) (written in posts.js) into anchors. Runs AFTER esc().
    // External links open in a new tab; on-site links (hoovytube.com / root-relative) stay put.
    function linkify(s) {
      return s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (_, text, url) {
        var ext = /^https?:\/\//.test(url) && !/(?:^|\/\/|\.)hoovytube\.com\b/.test(url);
        return '<a href="' + url + '"' + (ext ? ' target="_blank" rel="noopener"' : '') + '>' + text + '</a>';
      });
    }
    function fmtDate(iso) {
      var p = String(iso || '').split('-'); if (p.length !== 3) return iso || '';
      return MONTHS[(+p[1]) - 1] + ' ' + (+p[2]) + ', ' + p[0];
    }
    function plain(body) {
      return (body || []).map(function (b) {
        if (typeof b === 'string') return b;
        return b.quote || b.h || '';
      }).join(' ');
    }
    function readTime(post) {
      var words = plain(post.body).split(/\s+/).filter(Boolean).length;
      return Math.max(1, Math.round(words / 220)) + ' min read';
    }
    function toast(msg) {
      toastEl.textContent = msg; toastEl.classList.add('show');
      clearTimeout(toast._t); toast._t = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
    }

    // Cover <img> with graceful fallback when the file is missing
    function cover(post, extraClass) {
      var fb = '<div class="j-fallback"><span class="fw">HoovyTube</span><span class="ft">' + esc(post.title) + '</span></div>';
      if (!post.cover) return fb;
      return '<img class="' + (extraClass || '') + '" src="' + esc(post.cover) + '" alt="' + esc(post.coverAlt || post.title) +
        '" loading="lazy" onerror="this.closest(\'.j-cover,.article-cover,.j-thumb\').innerHTML=' +
        JSON.stringify(fb).replace(/"/g, '&quot;') + '">';
    }

    function tagsHtml(post) {
      if (!post.tags || !post.tags.length) return '';
      return '<span class="j-tags">' + post.tags.map(function (t) {
        return '<span class="j-tag">' + esc(t) + '</span>'; }).join('') + '</span>';
    }

    /* ---------- Index ---------- */
    function renderIndex() {
      document.title = 'Journal - HoovyTube';
      if (!POSTS.length) { root.innerHTML = '<div class="view"><p class="j-empty">No posts yet — check back soon.</p></div>'; return; }
      var f = POSTS[0];
      var html = '<div class="view">';
      html += '<a class="j-featured spot" href="#/' + esc(f.slug) + '">' +
        '<div class="j-cover">' + cover(f) + '</div>' +
        '<div class="j-body">' +
          '<p class="j-eyebrow">Latest</p>' +
          '<h2>' + esc(f.title) + '</h2>' +
          '<p class="j-dek">' + esc(f.dek || '') + '</p>' +
          '<div class="j-meta">' +
            tagsHtml(f) + (f.tags && f.tags.length ? '<span class="dot">·</span>' : '') +
            '<span>' + fmtDate(f.date) + '</span><span class="dot">·</span><span>' + readTime(f) + '</span>' +
          '</div>' +
          '<span class="j-readmore">Read the post ' + ICON.arrowR + '</span>' +
        '</div></a>';

      var rest = POSTS.slice(1);
      html += '<div class="j-listhead"><h3>More writing</h3><span>' + POSTS.length + ' post' + (POSTS.length === 1 ? '' : 's') + ' total</span></div>';
      if (!rest.length) {
        html += '<p class="j-empty">This is the first one. More to come — I write when something is worth tying off.</p>';
      } else {
        html += '<div class="j-list">' + rest.map(function (p) {
          return '<a class="j-row" href="#/' + esc(p.slug) + '">' +
            '<div class="j-thumb">' + cover(p) + '</div>' +
            '<div><h4>' + esc(p.title) + '</h4><p>' + esc(p.dek || '') + '</p>' +
            '<div class="j-meta"><span>' + fmtDate(p.date) + '</span><span class="dot">·</span><span>' + readTime(p) + '</span></div></div>' +
          '</a>';
        }).join('') + '</div>';
      }
      html += '</div>';
      root.innerHTML = html;
    }

    /* ---------- Article ---------- */
    function bodyHtml(post) {
      return (post.body || []).map(function (b) {
        if (typeof b === 'string') return '<p>' + linkify(esc(b)) + '</p>';
        if (b.h) return '<h2>' + esc(b.h) + '</h2>';
        if (b.quote) return '<blockquote>' + linkify(esc(b.quote)) + '</blockquote>';
        return '';
      }).join('');
    }

    function renderArticle(post) {
      document.title = post.title + ' - HoovyTube Journal';
      var i = POSTS.indexOf(post);
      var newer = POSTS[i - 1], older = POSTS[i + 1];
      var pn = '';
      if (newer || older) {
        pn = '<nav class="post-nav">' +
          (older ? '<a class="prev" href="#/' + esc(older.slug) + '"><div class="pn-label">← Older</div><div class="pn-title">' + esc(older.title) + '</div></a>'
                 : '<a class="prev disabled"><div class="pn-label">← Older</div><div class="pn-title">That\'s the last one</div></a>') +
          (newer ? '<a class="next" href="#/' + esc(newer.slug) + '"><div class="pn-label">Newer →</div><div class="pn-title">' + esc(newer.title) + '</div></a>'
                 : '<a class="next disabled"><div class="pn-label">Newer →</div><div class="pn-title">You\'re on the latest</div></a>') +
          '</nav>';
      }

      root.innerHTML = '<article class="article view">' +
        '<a class="j-back" href="#/">' + ICON.arrowL + ' All posts</a>' +
        '<header class="article-head">' +
          '<p class="article-kicker">Journal</p>' +
          '<h1>' + esc(post.title) + '</h1>' +
          (post.dek ? '<p class="article-dek">' + esc(post.dek) + '</p>' : '') +
          '<div class="article-meta"><span class="byline">' + esc(post.author || 'HoovyTube') + '</span>' +
            '<span class="dot">·</span><span>' + fmtDate(post.date) + '</span>' +
            '<span class="dot">·</span><span>' + readTime(post) + '</span></div>' +
        '</header>' +
        (post.cover ? '<div class="article-cover">' + cover(post) + '</div>' : '') +
        '<div class="prose">' + bodyHtml(post) + '</div>' +
        '<footer class="article-foot">' +
          '<div class="article-share">' +
            '<span>Share</span>' +
            '<button class="share-btn" data-share="copy">' + ICON.link + ' Copy link</button>' +
            '<a class="share-btn" data-share="x" target="_blank" rel="noopener">Post on X</a>' +
          '</div>' + pn +
        '</footer>' +
      '</article>';

      // wire share
      var url = location.href;
      var copyBtn = root.querySelector('[data-share="copy"]');
      if (copyBtn) copyBtn.addEventListener('click', function () {
        var done = function () { toast('Link copied'); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, done);
        else done();
      });
      var xBtn = root.querySelector('[data-share="x"]');
      if (xBtn) xBtn.href = 'https://twitter.com/intent/tweet?text=' +
        encodeURIComponent(post.title) + '&url=' + encodeURIComponent(url);
    }

    /* ---------- Router ---------- */
    function route() {
      var slug = (location.hash || '').replace(/^#\/?/, '').trim();
      var post = slug && POSTS.filter(function (p) { return p.slug === slug; })[0];
      if (post) renderArticle(post); else renderIndex();
      window.scrollTo({ top: 0, behavior: 'auto' });
    }
    window.addEventListener('hashchange', route);
    route();
  })();
  </script>

  <script defer src="/shared/ht-nav.js?v=10"></script>
  <script defer src="/shared/ht-ui.js?v=9"></script>
  <script defer src="/shared/ht-newsletter.js?v=9"></script>
</body>
</html>
