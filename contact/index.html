<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>Contact - HoovyTube</title>
  <meta name="description" content="Get in touch with HoovyTube and subscribe to the newsletter.">
  <link rel="stylesheet" href="/styles/ht.css?v=9">
  <script>try{var t=localStorage.getItem('ht-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <style>
    /* Map to shared themeable tokens (ht.css) so the theme toggle repaints this page */
    :root { --ht-accent: var(--accent); --ht-accent-ink: var(--accent-ink); --ht-bg: var(--bg); --ht-card: var(--panel); --ht-text: var(--text); --ht-muted: var(--muted); --ht-line: var(--line); --ht-input: var(--panel-2); }
    * { box-sizing: border-box; }
    body { margin: 0; padding-bottom: 120px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--ht-bg); color: var(--ht-text); line-height: 1.55; }
    .wrap { max-width: 640px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
    header.site { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.25rem; border-bottom: 1px solid var(--ht-line); }
    header.site a.brand { font-weight: 700; font-size: 1.15rem; color: var(--ht-text); text-decoration: none; letter-spacing: .3px; }
    header.site a.home { color: var(--ht-muted); text-decoration: none; font-size: .95rem; }
    header.site a.home:hover { color: var(--ht-text); }
    h1 { font-size: 1.9rem; margin: 0 0 .35rem; }
    p.lead { color: var(--ht-muted); margin: 0 0 2rem; }
    .card { background: var(--ht-card); border: 1px solid var(--ht-line); border-radius: 14px; padding: 1.5rem; margin-bottom: 1.75rem; }
    .card h2 { margin: 0 0 1rem; font-size: 1.2rem; }
    label { display: block; font-size: .85rem; color: var(--ht-muted); margin: 0 0 .3rem; }
    input, textarea { width: 100%; padding: .7rem .8rem; margin-bottom: 1rem; background: var(--ht-input); border: 1px solid var(--ht-line); border-radius: 8px; color: var(--ht-text); font: inherit; }
    input:focus, textarea:focus { outline: none; border-color: var(--ht-accent); }
    textarea { min-height: 130px; resize: vertical; }
    .row { display: flex; gap: 1rem; }
    .row > div { flex: 1; }
    button { background: var(--ht-accent); color: var(--ht-accent-ink); border: none; border-radius: 8px; padding: .8rem 1.4rem; font-weight: 600; font-size: 1rem; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    .msg { font-size: .9rem; margin-top: .5rem; min-height: 1.2em; }
    .msg.ok { color: #6fcf7f; }
    .msg.err { color: #e06b6b; }
    .news { display: flex; gap: .6rem; align-items: start; }
    .news input { margin-bottom: 0; }
    .news button { white-space: nowrap; }
    @media (max-width: 520px) { .row, .news { flex-direction: column; gap: 0; } }
  </style>
</head>
<body>
  <header class="site">
    <a class="brand" href="/">HoovyTube</a>
    <a class="home" href="/">← Home</a>
  </header>

  <main class="wrap">
    <h1>Get in touch</h1>
    <p class="lead">Questions, collaborations, or just want to say hi? Send a message - or subscribe to hear about what's next.</p>

    <section class="card">
      <h2>Contact</h2>
      <form id="contactForm" novalidate>
        <div class="row">
          <div>
            <label for="cName">Name</label>
            <input id="cName" name="name" type="text" autocomplete="name" required>
          </div>
          <div>
            <label for="cEmail">Email</label>
            <input id="cEmail" name="email" type="email" autocomplete="email" required>
          </div>
        </div>
        <label for="cSubject">Subject <span style="opacity:.6">(optional)</span></label>
        <input id="cSubject" name="subject" type="text">
        <label for="cMessage">Message</label>
        <textarea id="cMessage" name="message" required></textarea>
        <button type="submit" id="cSubmit">Send message</button>
        <div class="msg" id="cMsg" role="status" aria-live="polite"></div>
      </form>
    </section>

    <section class="card">
      <h2>Newsletter</h2>
      <p style="color:var(--ht-muted); margin:0 0 1rem; font-size:.95rem">Get occasional updates. No spam, unsubscribe anytime.</p>
      <form id="newsForm" class="news" novalidate>
        <div style="flex:1">
          <label for="nEmail" style="position:absolute;left:-9999px">Email</label>
          <input id="nEmail" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <button type="submit" id="nSubmit">Subscribe</button>
      </form>
      <div class="msg" id="nMsg" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script>
    const SUPABASE_URL = 'https://iglbfojatowaxbhjubvz.supabase.co';
    const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlnbGJmb2phdG93YXhiaGp1YnZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMzgyODUsImV4cCI6MjEwMTYxNDI4NX0.H7EeaGn3qQGn6pwFnDI_QRFW3uILnwDaWB54pUbWv6g';

    async function callFn(name, payload) {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/${name}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': ANON, 'Authorization': `Bearer ${ANON}` },
        body: JSON.stringify(payload),
      });
      let data = {};
      try { data = await res.json(); } catch { /* ignore */ }
      return { ok: res.ok, status: res.status, data };
    }

    // Contact form
    const cForm = document.getElementById('contactForm');
    const cMsg = document.getElementById('cMsg');
    const cSubmit = document.getElementById('cSubmit');
    cForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      cMsg.textContent = ''; cMsg.className = 'msg';
      const payload = {
        name: cForm.name.value.trim(),
        email: cForm.email.value.trim(),
        subject: cForm.subject.value.trim(),
        message: cForm.message.value.trim(),
      };
      if (!payload.name || !payload.email || !payload.message) {
        cMsg.textContent = 'Please fill in your name, email, and message.'; cMsg.className = 'msg err'; return;
      }
      cSubmit.disabled = true; cSubmit.textContent = 'Sending…';
      try {
        const { ok, data } = await callFn('contact-form', payload);
        if (ok) { cMsg.textContent = 'Thanks - your message was sent!'; cMsg.className = 'msg ok'; cForm.reset(); }
        else { cMsg.textContent = data.error || 'Something went wrong. Please try again.'; cMsg.className = 'msg err'; }
      } catch { cMsg.textContent = 'Network error. Please try again.'; cMsg.className = 'msg err'; }
      finally { cSubmit.disabled = false; cSubmit.textContent = 'Send message'; }
    });

    // Newsletter form
    const nForm = document.getElementById('newsForm');
    const nMsg = document.getElementById('nMsg');
    const nSubmit = document.getElementById('nSubmit');
    nForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      nMsg.textContent = ''; nMsg.className = 'msg';
      const email = nForm.email.value.trim();
      if (!email) { nMsg.textContent = 'Please enter your email.'; nMsg.className = 'msg err'; return; }
      nSubmit.disabled = true; nSubmit.textContent = 'Subscribing…';
      try {
        const { ok, data } = await callFn('newsletter-signup', { email, source: 'contact-page' });
        if (ok) { nMsg.textContent = "You're subscribed - thanks!"; nMsg.className = 'msg ok'; nForm.reset(); }
        else { nMsg.textContent = data.error || 'Could not subscribe. Please try again.'; nMsg.className = 'msg err'; }
      } catch { nMsg.textContent = 'Network error. Please try again.'; nMsg.className = 'msg err'; }
      finally { nSubmit.disabled = false; nSubmit.textContent = 'Subscribe'; }
    });
  </script>
  <script defer src="/shared/ht-nav.js?v=9"></script>
</body>
</html>
