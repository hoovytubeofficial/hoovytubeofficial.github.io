<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- HoovyTube Icon Forge source: mail (envelope). Simple single-colour silhouette; thin gaps = outline-coloured detail lines. -->
  <defs>
    <mask id="ml" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect width="256" height="256" fill="#fff"/>
      <polyline points="30,70 128,146 226,70" fill="none" stroke="#000" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="34" y1="200" x2="98" y2="128" stroke="#000" stroke-width="11" stroke-linecap="round"/>
      <line x1="222" y1="200" x2="158" y2="128" stroke="#000" stroke-width="11" stroke-linecap="round"/>
    </mask>
  </defs>
  <rect mask="url(#ml)" x="16" y="50" width="224" height="164" rx="20" fill="#000"/>
</svg>
